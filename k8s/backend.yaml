apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: 143710972226.dkr.ecr.us-east-1.amazonaws.com/devops-store-product:v1
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              value: jdbc:postgresql://database:5432/devops_store
            - name: DB_USERNAME
              value: storeuser
            - name: DB_PASSWORD
              value: storepass123
            - name: JAVA_TOOL_OPTIONS
              value: -Duser.timezone=Asia/Kolkata
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
spec:
  selector:
    app: product-service
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: review-service
  template:
    metadata:
      labels:
        app: review-service
    spec:
      containers:
        - name: review-service
          image: 143710972226.dkr.ecr.us-east-1.amazonaws.com/devops-store-review:v1
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: database
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: devops_store
            - name: DB_USER
              value: storeuser
            - name: DB_PASSWORD
              value: storepass123
---
apiVersion: v1
kind: Service
metadata:
  name: review-service
spec:
  selector:
    app: review-service
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
---
